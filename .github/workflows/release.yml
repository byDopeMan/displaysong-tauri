name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            # Plugins variant: no auto-updater (main owns the 'latest' channel),
            # so we build the plain installers only — no updater bundle, no signing.
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # The plugins variant bundles a portable Python (src-tauri/nsis/python,
      # listed under bundle.resources). That folder is gitignored (60 MB), so CI
      # must recreate it: download the 3.11 embeddable, enable site, bootstrap pip.
      # yt-dlp itself is pip-installed by the app at runtime on first use.
      - name: Prepare bundled Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = "src-tauri/nsis/python"
          New-Item -ItemType Directory -Force -Path $py | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.11.7/python-3.11.7-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath $py -Force
          (Get-Content "$py/python311._pth") -replace '#import site', 'import site' | Set-Content "$py/python311._pth"
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "$py/get-pip.py"
          & "$py/python.exe" "$py/get-pip.py" --no-warn-script-location
          & "$py/python.exe" --version

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DisplaySong Plugins ${{ github.ref_name }}'
          releaseBody: |
            Siehe [Changelog](https://github.com/${{ github.repository }}/blob/main/README.md#-changelog) für Details.
            
            ## Downloads
            | Plattform | Datei |
            |-----------|-------|
            | **Windows** | `DisplaySong_x.x.x_x64-setup.exe` (empfohlen) oder `.msi` |
            
            ---
            ℹ️ Plugins-Variante: manuell herunterladen & installieren (kein Auto-Update).
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}
