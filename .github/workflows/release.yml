name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      # ===== Debug Secrets =====
      - name: Debug Secrets
        shell: bash
        run: |
          echo "Checking secrets..."
          if [ -z "$TAURI_PRIVATE_KEY" ]; then
            echo "❌ TAURI_PRIVATE_KEY ist leer!"
          else
            echo "✅ TAURI_PRIVATE_KEY gesetzt (Länge: ${#TAURI_PRIVATE_KEY})"
            echo "Erste 50 Zeichen: ${TAURI_PRIVATE_KEY:0:50}"
          fi
          
          if [ -z "$TAURI_KEY_PASSWORD" ]; then
            echo "❌ TAURI_KEY_PASSWORD ist leer!"
          else
            echo "✅ TAURI_KEY_PASSWORD gesetzt"
          fi
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # ===== Jetzt der Build =====
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DisplaySong ${{ github.ref_name }}'
          releaseBody: |
            Siehe [Changelog](https://github.com/${{ github.repository }}/blob/main/README.md#-changelog) für Details.
            
            ## Downloads
            | Plattform | Datei |
            |-----------|-------|
            | **Windows** | `DisplaySong_x.x.x_x64-setup.exe` (empfohlen) oder `.msi` |
            
            ---
            ℹ️ Die App prüft automatisch auf Updates!
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}
