<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Widget - Album</title>
  <style>
    :root {
      --r: 29;
      --g: 185;
      --b: 84;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ===== IDLE STATE ===== */
    .idle {
      width: 280px;
      background: linear-gradient(145deg, rgba(30,30,30,0.92), rgba(10,10,10,0.95));
      backdrop-filter: blur(24px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 20px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .idle.hidden { display: none; }

    .idle-icon {
      width: 200px;
      height: 200px;
      margin: 0 auto 18px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .idle-icon svg {
      width: 70px;
      height: 70px;
      opacity: 0.15;
    }

    .idle-text {
      font-size: 14px;
      color: rgba(255,255,255,0.25);
      margin-bottom: 16px;
    }

    .idle-bar {
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
    }

    /* ===== WIDGET ===== */
    .widget {
      width: 280px;
      background: linear-gradient(
        145deg,
        rgba(var(--r), var(--g), var(--b), 0.1),
        rgba(0, 0, 0, 0.92)
      );
      backdrop-filter: blur(24px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 20px;
      text-align: center;
      box-shadow: 
        0 25px 50px rgba(0,0,0,0.5),
        0 0 100px rgba(var(--r), var(--g), var(--b), 0.1);
    }

    .widget.hidden { display: none; }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: rgb(var(--r), var(--g), var(--b));
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .header.paused .pulse {
      animation: none;
      background: rgba(255,255,255,0.3);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgb(var(--r), var(--g), var(--b));
    }

    .header.paused .label {
      color: rgba(255,255,255,0.4);
    }

    .cover {
      width: 200px;
      height: 200px;
      margin: 0 auto 18px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      background-size: cover;
      background-position: center;
      box-shadow: 
        0 15px 40px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.05);
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 2px;
    }

    .album {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-wrap { margin-top: 16px; }

    .progress {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, 
        rgb(var(--r), var(--g), var(--b)),
        rgba(var(--r), var(--g), var(--b), 0.6)
      );
      width: 0%;
      transition: width 1s linear;
    }

    .time {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 10px;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <!-- Idle State -->
  <div class="idle" id="idle">
    <div class="idle-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="idle-text">Warte auf Musik...</div>
    <div class="idle-bar"></div>
  </div>

  <!-- Active Widget -->
  <div class="widget hidden" id="widget">
    <div class="header" id="header">
      <span class="pulse"></span>
      <span class="label">Now Playing</span>
    </div>
    <div class="cover" id="cover"></div>
    <div class="title" id="title">—</div>
    <div class="artist" id="artist">—</div>
    <div class="album" id="album">—</div>
    <div class="progress-wrap">
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="time">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
  </div>

  <script type="module">
    const isDemo = !window.__TAURI__;

    if (isDemo) {
        import('./mock-track.js').then(({ startDemo }) => {
            startDemo(update);
        });
    } else {
        listen('track-update', (e) => update(e.payload));
        invoke('get_track').then(update);
    }
    
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.tauri;
    const appWindow = window.__TAURI__.window?.appWindow || window.__TAURI__.window?.getCurrent?.();

    if (appWindow) {
      document.addEventListener('mousedown', async (e) => {
        if (e.buttons === 1) {
          try { await appWindow.startDragging(); } catch(e) {}
        }
      });
    }

    const $ = (id) => document.getElementById(id);
    let currentTrack = null;

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
    }

    function update(track) {
      const widget = $('widget');
      const idle = $('idle');
      const header = $('header');
      const cover = $('cover');
      const title = $('title');
      const artist = $('artist');
      const album = $('album');
      const progress = $('progress');
      const timeCurrent = $('time-current');
      const timeTotal = $('time-total');

      if (!track?.track) {
        widget?.classList.add('hidden');
        idle?.classList.remove('hidden');
        return;
      }

      idle?.classList.add('hidden');
      widget?.classList.remove('hidden');

      if (track.albumCover && track.albumCover !== currentTrack?.albumCover) {
        if (cover) cover.style.backgroundImage = `url('${track.albumCover}')`;
      }

      if (title) title.textContent = track.track;
      if (artist) artist.textContent = track.artist;
      if (album) album.textContent = track.album;

      header?.classList.toggle('paused', !track.isPlaying);

      if (track.color) {
        document.documentElement.style.setProperty('--r', track.color.r);
        document.documentElement.style.setProperty('--g', track.color.g);
        document.documentElement.style.setProperty('--b', track.color.b);
      }

      if (track.durationMs > 0) {
        if (progress) progress.style.width = `${(track.progressMs / track.durationMs) * 100}%`;
        if (timeCurrent) timeCurrent.textContent = formatTime(track.progressMs);
        if (timeTotal) timeTotal.textContent = formatTime(track.durationMs);
      }

      currentTrack = track;
    }

    listen('track-update', (e) => update(e.payload));
    invoke('get_track').then(update);

    setInterval(() => {
      if (currentTrack?.isPlaying && currentTrack.durationMs > 0) {
        currentTrack.progressMs = Math.min(currentTrack.progressMs + 1000, currentTrack.durationMs);
        const progress = $('progress');
        const timeCurrent = $('time-current');
        if (progress) progress.style.width = `${(currentTrack.progressMs / currentTrack.durationMs) * 100}%`;
        if (timeCurrent) timeCurrent.textContent = formatTime(currentTrack.progressMs);
      }
    }, 1000);
  </script>
</body>
</html>
