[package]
name = "DisplaySong"
version = "2.0.0"
description = "Spotify Now Playing Widget"
authors = ["Jstn"]
edition = "2021"

[package.metadata.tauri.windows]
windows_subsystem = "windows"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri
tauri = { version = "1.8", features = [ "shell-open", "path-all", "window-all", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }

# HTTP Client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# URL Encoding
urlencoding = "2"

# Secure credential storage
keyring = "2"

# Image processing for color extraction
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

# Logging
log = "0.4"
env_logger = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
