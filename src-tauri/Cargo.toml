[package]
name = "displaysong"
version = "0.0.0"
description = "Spotify Now Playing Widget"
authors = ["DisplaySong"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri (mit Updater!)
tauri = { version = "1.8", features = [ "dialog-confirm", "shell-open", "path-all", "window-all", "system-tray", "updater", "process-relaunch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async Runtime - Single-Thread für weniger RAM (~15 MB Ersparnis)
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }

# HTTP Client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# URL Encoding
urlencoding = "2"

# Secure credential storage
keyring = "2"

# Image processing for color extraction
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

# Logging
log = "0.4"
fern = { version = "0.6", features = ["colored"] }
chrono = "0.4"

# Lazy static für Caching
once_cell = "1.19"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release-Optimierungen für kleinere Binary und weniger RAM
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
