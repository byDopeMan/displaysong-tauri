[package]
name = "displaysong"
version = "4.1.0"
description = "Spotify Now Playing Widget"
authors = ["DisplaySong"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri (mit Updater!)
tauri = { version = "1.8", features = [ "updater", "dialog-open", "dialog-confirm", "shell-open", "path-all", "window-all", "system-tray", "process-relaunch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async Runtime - Single-Thread für weniger RAM (~15 MB Ersparnis)
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }

# WebSocket für Twitch EventSub
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# HTTP Client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# URL Encoding
urlencoding = "2"

# Browser öffnen
open = "5"

# Secure credential storage
keyring = "2"

# Image processing for color extraction
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

# Logging
log = "0.4"
fern = { version = "0.6", features = ["colored"] }
chrono = "0.4"

# Lazy static für Caching
once_cell = "1.19"

# ZIP für Plugin-Installation
zip = "0.6"

# SQLite für Song Request Queue
rusqlite = { version = "0.31", features = ["bundled"] }

# Env vars laden
dotenvy = "0.15"

# Lightweight regex für Songlink
regex-lite = "0.1"

# Windows Media Session API für universelle Musik-Erkennung
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release-Optimierungen für kleinere Binary und weniger RAM
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
