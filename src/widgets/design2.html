<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Widget - Album Focus</title>
  <style>
    :root {
      --r: 29;
      --g: 185;
      --b: 84;
      --transition-duration: 0.5s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ===== IDLE STATE ===== */
    .idle {
      width: 280px;
      background: linear-gradient(145deg, rgba(30,30,30,0.92), rgba(10,10,10,0.95));
      backdrop-filter: blur(24px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 20px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .idle.hidden { 
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    .idle-icon {
      width: 200px;
      height: 200px;
      margin: 0 auto 18px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .idle-icon svg {
      width: 70px;
      height: 70px;
      opacity: 0.15;
    }

    .idle-text {
      font-size: 14px;
      color: rgba(255,255,255,0.25);
      margin-bottom: 16px;
    }

    .idle-bar {
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
    }

    /* ===== WIDGET ===== */
    .widget {
      width: 280px;
      background: linear-gradient(
        145deg,
        rgba(var(--r), var(--g), var(--b), 0.1),
        rgba(0, 0, 0, 0.92)
      );
      backdrop-filter: blur(24px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 20px;
      text-align: center;
      box-shadow: 
        0 25px 50px rgba(0,0,0,0.5),
        0 0 100px rgba(var(--r), var(--g), var(--b), 0.1);
      transition: background var(--transition-duration) ease,
                  box-shadow var(--transition-duration) ease;
      will-change: background, box-shadow;
    }

    .widget.hidden { 
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    /* Smooth transitions for show/hide */
    .idle, .widget {
      transition: opacity var(--transition-duration) ease,
                  background var(--transition-duration) ease,
                  box-shadow var(--transition-duration) ease;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: rgb(var(--r), var(--g), var(--b));
      border-radius: 50%;
      /* Animation nur wenn nicht pausiert */
      animation: none;
      transition: background var(--transition-duration) ease;
    }

    .header:not(.paused) .pulse {
      animation: pulse 1.5s infinite;
    }

    .header.paused .pulse {
      background: rgba(255,255,255,0.3);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgb(var(--r), var(--g), var(--b));
      transition: color var(--transition-duration) ease;
    }

    .header.paused .label {
      color: rgba(255,255,255,0.4);
    }

    /* ===== COVER MIT FLIP TRANSITION ===== */
    .cover-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 18px;
      position: relative;
      perspective: 1000px;
    }

    .cover {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      background-size: cover;
      background-position: center;
      box-shadow: 
        0 15px 40px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.05);
      transition: opacity var(--transition-duration) ease,
                  transform var(--transition-duration) ease;
      backface-visibility: hidden;
      will-change: opacity, transform;
    }

    .cover.new {
      opacity: 1;
      transform: scale(1) rotateY(0deg);
    }

    .cover.old {
      opacity: 0;
      transform: scale(0.85) rotateY(15deg);
    }

    /* ===== TEXT MIT FADE/SLIDE TRANSITION ===== */
    .text-container {
      position: relative;
      overflow: hidden;
    }

    .title-container { height: 22px; margin-bottom: 4px; }
    .artist-container { height: 18px; margin-bottom: 2px; }
    .album-container { height: 16px; }

    .title, .artist, .album {
      position: absolute;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform var(--transition-duration) ease,
                  opacity var(--transition-duration) ease;
      will-change: transform, opacity;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .artist {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }

    .album {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }

    .title.new, .artist.new, .album.new {
      transform: translateY(0);
      opacity: 1;
    }

    .title.old, .artist.old, .album.old {
      transform: translateY(-100%);
      opacity: 0;
    }

    .title.entering, .artist.entering, .album.entering {
      transform: translateY(100%);
      opacity: 0;
    }

    .requester {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 12px;
      padding: 4px 10px;
      max-width: 100%;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: rgba(var(--r), var(--g), var(--b), 0.9);
      border-radius: 10px;
      transition: background var(--transition-duration) ease;
    }

    .requester svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .requester .requester-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-wrap { margin-top: 16px; }

    .progress {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, 
        rgb(var(--r), var(--g), var(--b)),
        rgba(var(--r), var(--g), var(--b), 0.6)
      );
      width: 0%;
      transition: width 1s linear, background var(--transition-duration) ease;
      will-change: width;
      transform: translateZ(0); /* GPU Layer */
    }

    .time {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 10px;
      color: rgba(255,255,255,0.35);
    }

    /* Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Idle State -->
  <div class="idle" id="idle">
    <div class="idle-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="idle-text">Warte auf Musik...</div>
    <div class="idle-bar"></div>
  </div>

  <!-- Active Widget -->
  <div class="widget hidden" id="widget">
    <div class="header" id="header">
      <span class="pulse"></span>
      <span class="label">Now Playing</span>
    </div>
    <div class="cover-container">
      <div class="cover new" id="cover"></div>
      <div class="cover old" id="cover-old"></div>
    </div>
    <div class="text-container title-container">
      <div class="title new" id="title">—</div>
      <div class="title old" id="title-old">—</div>
    </div>
    <div class="text-container artist-container">
      <div class="artist new" id="artist">—</div>
      <div class="artist old" id="artist-old">—</div>
    </div>
    <div class="text-container album-container">
      <div class="album new" id="album">—</div>
      <div class="album old" id="album-old">—</div>
    </div>
    <div class="progress-wrap">
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="time">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
    <div class="requester" id="requester" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span class="requester-name" id="requester-name"></span>
    </div>
  </div>

  <script type="module">
    async function waitForTauri() {
      let attempts = 0;
      while (!window.__TAURI__ && attempts < 100) {
        await new Promise(r => setTimeout(r, 50));
        attempts++;
      }
      return window.__TAURI__;
    }

    (async () => {
      const tauri = await waitForTauri();
      if (!tauri) { console.error('Tauri API nicht verfügbar'); return; }

      const listen = tauri.event?.listen || tauri.listen;
      const invoke = tauri.tauri?.invoke || tauri.invoke;
      const appWindow = tauri.window?.appWindow || tauri.window?.getCurrent?.() || tauri.appWindow;

      if (!listen || !invoke) { console.error('Tauri listen/invoke nicht gefunden'); return; }

      if (appWindow) {
        document.addEventListener('mousedown', async (e) => {
          if (e.buttons === 1) {
            try { await appWindow.startDragging(); } catch(e) {}
          }
        });
      }

      const $ = (id) => document.getElementById(id);
      let currentTrack = null;
      let useAccentColor = false;
      let accentColor = null;
      let isTransitioning = false;
      let progressInterval = null;
      let isPageVisible = true;
      let autoHideEnabled = window.autoHideEnabled || false;
      let requesterUser = null;
      let requesterEnabled = false;
      try { requesterEnabled = localStorage.getItem('widget-show-requester') === 'true'; } catch (e) {}

      function renderRequester() {
        const el = $('requester');
        const name = $('requester-name');
        if (!el) return;
        if (requesterEnabled && requesterUser) {
          if (name) name.textContent = requesterUser;
          el.style.display = '';
        } else {
          el.style.display = 'none';
        }
      }

      // ===== PAGE VISIBILITY API - Timer pausieren wenn nicht sichtbar =====
      document.addEventListener('visibilitychange', () => {
        isPageVisible = !document.hidden;
        if (isPageVisible && currentTrack?.isPlaying) {
          startProgressTimer();
        } else {
          stopProgressTimer();
        }
      });

      function startProgressTimer() {
        if (progressInterval) return;
        progressInterval = setInterval(() => {
          if (currentTrack?.isPlaying && currentTrack.durationMs > 0 && isPageVisible) {
            currentTrack.progressMs = Math.min(currentTrack.progressMs + 1000, currentTrack.durationMs);
            const progress = $('progress');
            const timeCurrent = $('time-current');
            if (progress) progress.style.width = `${(currentTrack.progressMs / currentTrack.durationMs) * 100}%`;
            if (timeCurrent) timeCurrent.textContent = formatTime(currentTrack.progressMs);
          }
        }, 1000);
      }

      function stopProgressTimer() {
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
      }

      // Akzentfarbe Event Listener
      window.addEventListener('accent-color-change', (e) => {
        useAccentColor = true;
        accentColor = e.detail;
        setColor(accentColor.r, accentColor.g, accentColor.b);
      });

      window.addEventListener('accent-color-reset', () => {
        useAccentColor = false;
        accentColor = null;
        if (currentTrack?.color) {
          setColor(currentTrack.color.r, currentTrack.color.g, currentTrack.color.b);
        }
      });

      // Auto-hide Event Listener
      window.addEventListener('autohide-change', (e) => {
        autoHideEnabled = e.detail.enabled;
        if (currentTrack) {
          update(currentTrack);
        } else {
          update(null);
        }
      });

      function setColor(r, g, b) {
        document.documentElement.style.setProperty('--r', r);
        document.documentElement.style.setProperty('--g', g);
        document.documentElement.style.setProperty('--b', b);
      }

      function formatTime(ms) {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
      }

      async function transitionToNewTrack(track) {
        if (isTransitioning) return;
        isTransitioning = true;

        const cover = $('cover');
        const coverOld = $('cover-old');
        const title = $('title');
        const titleOld = $('title-old');
        const artist = $('artist');
        const artistOld = $('artist-old');
        const album = $('album');
        const albumOld = $('album-old');

        if (currentTrack) {
          coverOld.style.backgroundImage = cover.style.backgroundImage;
          titleOld.textContent = title.textContent;
          artistOld.textContent = artist.textContent;
          albumOld.textContent = album.textContent;

          coverOld.classList.remove('old');
          coverOld.classList.add('new');
          cover.classList.remove('new');
          cover.classList.add('old');

          titleOld.classList.remove('old');
          titleOld.classList.add('new');
          title.classList.add('entering');
          title.classList.remove('new');

          artistOld.classList.remove('old');
          artistOld.classList.add('new');
          artist.classList.add('entering');
          artist.classList.remove('new');

          albumOld.classList.remove('old');
          albumOld.classList.add('new');
          album.classList.add('entering');
          album.classList.remove('new');
        }

        cover.style.backgroundImage = `url('${track.albumCover}')`;
        title.textContent = track.track;
        artist.textContent = track.artist;
        album.textContent = track.album;

        if (track.color && !useAccentColor) {
          setColor(track.color.r, track.color.g, track.color.b);
        }

        await new Promise(r => setTimeout(r, 50));

        cover.classList.remove('old');
        cover.classList.add('new');
        coverOld.classList.remove('new');
        coverOld.classList.add('old');

        title.classList.remove('entering');
        title.classList.add('new');
        titleOld.classList.remove('new');
        titleOld.classList.add('old');

        artist.classList.remove('entering');
        artist.classList.add('new');
        artistOld.classList.remove('new');
        artistOld.classList.add('old');

        album.classList.remove('entering');
        album.classList.add('new');
        albumOld.classList.remove('new');
        albumOld.classList.add('old');

        await new Promise(r => setTimeout(r, 500));
        isTransitioning = false;
      }

      function update(track) {
        const widget = $('widget');
        const idle = $('idle');
        const header = $('header');
        const progress = $('progress');
        const timeCurrent = $('time-current');
        const timeTotal = $('time-total');

        if (!track?.track) {
          if (autoHideEnabled) {
            // Hide everything when auto-hide is enabled
            widget?.classList.add('hidden');
            idle?.classList.add('hidden');
          } else {
            widget?.classList.add('hidden');
            idle?.classList.remove('hidden');
          }
          currentTrack = null;
          stopProgressTimer();
          return;
        }

        idle?.classList.add('hidden');
        widget?.classList.remove('hidden');

        const isNewTrack = !currentTrack || 
          currentTrack.track !== track.track || 
          currentTrack.artist !== track.artist;

        if (isNewTrack) {
          transitionToNewTrack(track);
        }

        header?.classList.toggle('paused', !track.isPlaying);

        if (track.durationMs > 0) {
          if (progress) progress.style.width = `${(track.progressMs / track.durationMs) * 100}%`;
          if (timeCurrent) timeCurrent.textContent = formatTime(track.progressMs);
          if (timeTotal) timeTotal.textContent = formatTime(track.durationMs);
        }

        currentTrack = { ...track };

        // Progress Timer starten/stoppen basierend auf Play-Status
        if (track.isPlaying && isPageVisible) {
          startProgressTimer();
        } else {
          stopProgressTimer();
        }
      }

      await listen('track-update', (e) => update(e.payload));

      // Requester display (song requests)
      await listen('requester-update', (e) => {
        requesterUser = e.payload?.user || null;
        renderRequester();
      });
      await listen('requester-visibility-change', (e) => {
        requesterEnabled = !!e.payload?.enabled;
        renderRequester();
      });
      renderRequester();

      try { const track = await invoke('get_track'); update(track); } catch (e) {}
    })();
  </script>
</body>
</html>
