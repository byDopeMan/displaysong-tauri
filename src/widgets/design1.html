<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Widget - Compact Bar</title>
  <style>
    :root {
      --r: 29;
      --g: 185;
      --b: 84;
      --transition-duration: 0.4s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 10px;
    }

    /* ===== IDLE STATE ===== */
    .idle {
      background: linear-gradient(135deg, rgba(30,30,30,0.9), rgba(10,10,10,0.95));
      backdrop-filter: blur(20px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .idle.hidden { 
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }


    .idle-icon {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .idle-icon svg {
      width: 32px;
      height: 32px;
      opacity: 0.2;
    }

    .idle-info {
      flex: 1;
      min-width: 0;
    }

    .idle-text {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 6px;
    }

    .idle-bar {
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      margin-top: 10px;
    }

    /* ===== WIDGET ===== */
    .widget {
      background: linear-gradient(
        135deg,
        rgba(var(--r), var(--g), var(--b), 0.15),
        rgba(0, 0, 0, 0.85)
      );
      backdrop-filter: blur(20px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: background var(--transition-duration) ease;
      will-change: background;
    }

    .widget.hidden { 
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    /* Smooth transitions for show/hide */
    .idle, .widget {
      transition: opacity var(--transition-duration) ease;
    }

    /* ===== COVER MIT TRANSITION ===== */
    .cover-container {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.05);
      background-size: cover;
      background-position: center;
      transition: opacity var(--transition-duration) ease, 
                  transform var(--transition-duration) ease;
      will-change: opacity, transform;
    }

    .cover.old {
      opacity: 0;
      transform: scale(0.9);
    }

    .cover.new {
      opacity: 1;
      transform: scale(1);
    }

    .info { 
      flex: 1; 
      min-width: 0;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgb(var(--r), var(--g), var(--b));
      margin-bottom: 6px;
      transition: color var(--transition-duration) ease;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: rgb(var(--r), var(--g), var(--b));
      border-radius: 50%;
      /* Animation nur wenn nicht pausiert - wird per JS gesteuert */
      animation: none;
      transition: background var(--transition-duration) ease;
    }

    .badge:not(.paused)::before {
      animation: pulse 1.5s infinite;
    }

    .badge.paused { color: rgba(255,255,255,0.4); }
    .badge.paused::before { background: rgba(255,255,255,0.3); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== TEXT MIT SLIDE TRANSITION ===== */
    .text-container {
      position: relative;
      overflow: hidden;
    }

    .title-container {
      height: 20px;
      margin-bottom: 2px;
    }

    .artist-container {
      height: 16px;
    }

    .title, .artist {
      position: absolute;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform var(--transition-duration) ease,
                  opacity var(--transition-duration) ease;
      will-change: transform, opacity;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .artist {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    .title.old, .artist.old {
      transform: translateY(-100%);
      opacity: 0;
    }

    .title.new, .artist.new {
      transform: translateY(0);
      opacity: 1;
    }

    .title.entering, .artist.entering {
      transform: translateY(100%);
      opacity: 0;
    }

    /* Marquee for long titles/artists (inner span scrolls within the clip box) */
    .title .mq-text, .artist .mq-text { display: inline-block; will-change: transform; }
    .title .mq-text.mq-run, .artist .mq-text.mq-run {
      animation: mq-scroll 11s ease-in-out infinite alternate;
    }
    @keyframes mq-scroll {
      0%, 12% { transform: translateX(0); }
      88%, 100% { transform: translateX(var(--mq-shift, 0)); }
    }

    .requester {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 3px 8px;
      width: fit-content;
      max-width: 100%;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: rgba(var(--r), var(--g), var(--b), 0.9);
      border-radius: 10px;
      transition: background var(--transition-duration) ease;
    }

    .requester svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .requester .requester-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress {
      margin-top: 10px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: rgb(var(--r), var(--g), var(--b));
      width: 0%;
      transition: width 1s linear, background var(--transition-duration) ease;
      will-change: width;
      transform: translateZ(0); /* GPU Layer */
    }

    /* Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Idle State -->
  <div class="idle" id="idle">
    <div class="idle-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="idle-info">
      <div class="idle-text">Warte auf Musik...</div>
      <div class="idle-bar"></div>
    </div>
  </div>

  <!-- Active Widget -->
  <div class="widget hidden" id="widget">
    <div class="cover-container">
      <div class="cover new" id="cover"></div>
      <div class="cover old" id="cover-old"></div>
    </div>
    <div class="info">
      <div class="badge" id="badge">Läuft jetzt</div>
      <div class="text-container title-container">
        <div class="title new" id="title">—</div>
        <div class="title old" id="title-old">—</div>
      </div>
      <div class="text-container artist-container">
        <div class="artist new" id="artist">—</div>
        <div class="artist old" id="artist-old">—</div>
      </div>
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="requester" id="requester" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span class="requester-name" id="requester-name"></span>
      </div>
    </div>
  </div>

  <script type="module">
    async function waitForTauri() {
      let attempts = 0;
      while (!window.__TAURI__ && attempts < 100) {
        await new Promise(r => setTimeout(r, 50));
        attempts++;
      }
      return window.__TAURI__;
    }

    (async () => {
      const tauri = await waitForTauri();
      if (!tauri) { console.error('Tauri API nicht verfügbar'); return; }

      const listen = tauri.event?.listen || tauri.listen;
      const invoke = tauri.tauri?.invoke || tauri.invoke;
      const appWindow = tauri.window?.appWindow || tauri.window?.getCurrent?.() || tauri.appWindow;

      if (!listen || !invoke) { console.error('Tauri listen/invoke nicht gefunden'); return; }

      if (appWindow) {
        document.addEventListener('mousedown', async (e) => {
          if (e.buttons === 1) {
            try { await appWindow.startDragging(); } catch(e) {}
          }
        });
      }

      const $ = (id) => document.getElementById(id);
      let currentTrack = null;
      let useAccentColor = false;
      let accentColor = null;
      let isTransitioning = false;
      let progressInterval = null;
      let isPageVisible = true;
      let autoHideEnabled = false;
      try { autoHideEnabled = localStorage.getItem('widget-autohide') === 'true'; } catch (e) {}
      let requesterUser = null;
      let requesterEnabled = false;
      try { requesterEnabled = localStorage.getItem('widget-show-requester') === 'true'; } catch (e) {}

      function renderRequester() {
        const el = $('requester');
        const name = $('requester-name');
        if (!el) return;
        if (requesterEnabled && requesterUser) {
          if (name) name.textContent = requesterUser;
          el.style.display = '';
        } else {
          el.style.display = 'none';
        }
      }

      // ===== PAGE VISIBILITY API - Timer pausieren wenn nicht sichtbar =====
      document.addEventListener('visibilitychange', () => {
        isPageVisible = !document.hidden;
        if (isPageVisible && currentTrack?.isPlaying) {
          startProgressTimer();
        } else {
          stopProgressTimer();
        }
      });

      function startProgressTimer() {
        if (progressInterval) return;
        progressInterval = setInterval(() => {
          if (currentTrack?.isPlaying && currentTrack.durationMs > 0 && isPageVisible) {
            currentTrack.progressMs = Math.min(currentTrack.progressMs + 1000, currentTrack.durationMs);
            const progress = $('progress');
            if (progress) progress.style.width = `${(currentTrack.progressMs / currentTrack.durationMs) * 100}%`;
          }
        }, 1000);
      }

      function stopProgressTimer() {
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
      }

      // Akzentfarbe Event Listener
      window.addEventListener('accent-color-change', (e) => {
        useAccentColor = true;
        accentColor = e.detail;
        setColor(accentColor.r, accentColor.g, accentColor.b);
      });

      window.addEventListener('accent-color-reset', () => {
        useAccentColor = false;
        accentColor = null;
        if (currentTrack?.color) {
          setColor(currentTrack.color.r, currentTrack.color.g, currentTrack.color.b);
        }
      });

      function setColor(r, g, b) {
        document.documentElement.style.setProperty('--r', r);
        document.documentElement.style.setProperty('--g', g);
        document.documentElement.style.setProperty('--b', b);
      }

      // Set text in an inner span and scroll it (marquee) if it overflows.
      function mqText(el, text) {
        if (!el) return;
        let span = el.querySelector('.mq-text');
        if (!span) { el.textContent = ''; span = document.createElement('span'); span.className = 'mq-text'; el.appendChild(span); }
        span.textContent = text;
        span.classList.remove('mq-run');
        span.style.removeProperty('--mq-shift');
        requestAnimationFrame(() => {
          const ov = span.scrollWidth - el.clientWidth;
          if (ov > 4) { span.style.setProperty('--mq-shift', `-${ov + 12}px`); span.classList.add('mq-run'); }
        });
      }

      async function transitionToNewTrack(track) {
        if (isTransitioning) return;
        isTransitioning = true;

        const cover = $('cover');
        const coverOld = $('cover-old');
        const title = $('title');
        const titleOld = $('title-old');
        const artist = $('artist');
        const artistOld = $('artist-old');

        if (currentTrack) {
          coverOld.style.backgroundImage = cover.style.backgroundImage;
          mqText(titleOld, title.textContent);
          mqText(artistOld, artist.textContent);

          coverOld.classList.remove('old');
          coverOld.classList.add('new');
          cover.classList.remove('new');
          cover.classList.add('old');

          titleOld.classList.remove('old');
          titleOld.classList.add('new');
          title.classList.add('entering');
          title.classList.remove('new');

          artistOld.classList.remove('old');
          artistOld.classList.add('new');
          artist.classList.add('entering');
          artist.classList.remove('new');
        }

        cover.style.backgroundImage = `url('${track.albumCover}')`;
        mqText(title, track.track);
        mqText(artist, track.artist);

        if (track.color && !useAccentColor) {
          setColor(track.color.r, track.color.g, track.color.b);
        }

        await new Promise(r => setTimeout(r, 50));

        cover.classList.remove('old');
        cover.classList.add('new');
        coverOld.classList.remove('new');
        coverOld.classList.add('old');

        title.classList.remove('entering');
        title.classList.add('new');
        titleOld.classList.remove('new');
        titleOld.classList.add('old');

        artist.classList.remove('entering');
        artist.classList.add('new');
        artistOld.classList.remove('new');
        artistOld.classList.add('old');

        await new Promise(r => setTimeout(r, 400));
        isTransitioning = false;
      }

      function update(track) {
        const widget = $('widget');
        const idle = $('idle');
        const badge = $('badge');
        const progress = $('progress');

        // Auto-hide ("Ausblenden wenn pausiert"): hide the widget when nothing
        // is playing OR when playback is paused.
        if (autoHideEnabled && (!track?.track || !track.isPlaying)) {
          widget?.classList.add('hidden');
          idle?.classList.add('hidden');
          currentTrack = track?.track ? { ...track } : null;
          stopProgressTimer();
          return;
        }

        if (!track?.track) {
          widget?.classList.add('hidden');
          idle?.classList.remove('hidden');
          currentTrack = null;
          stopProgressTimer();
          return;
        }

        idle?.classList.add('hidden');
        widget?.classList.remove('hidden');

        const isNewTrack = !currentTrack || 
          currentTrack.track !== track.track || 
          currentTrack.artist !== track.artist;

        if (isNewTrack) {
          transitionToNewTrack(track);
        }

        if (badge) {
          badge.classList.toggle('paused', !track.isPlaying);
          badge.textContent = track.isPlaying ? 'Läuft jetzt' : 'Pausiert';
        }

        if (track.durationMs > 0 && progress) {
          progress.style.width = `${(track.progressMs / track.durationMs) * 100}%`;
        }

        currentTrack = { ...track };

        // Progress Timer starten/stoppen basierend auf Play-Status
        if (track.isPlaying && isPageVisible) {
          startProgressTimer();
        } else {
          stopProgressTimer();
        }
      }

      await listen('track-update', (e) => update(e.payload));

      // Requester display (song requests): who requested the current track, and
      // whether the "show requester" design option is enabled.
      await listen('requester-update', (e) => {
        requesterUser = e.payload?.user || null;
        renderRequester();
      });
      await listen('requester-visibility-change', (e) => {
        requesterEnabled = !!e.payload?.enabled;
        renderRequester();
      });

      // Global auto-hide ("Ausblenden wenn pausiert"): re-evaluate visibility.
      await listen('autohide-change', (e) => {
        autoHideEnabled = !!e.payload?.enabled;
        update(currentTrack || null);
      });
      renderRequester();

      try { const track = await invoke('get_track'); update(track); } catch (e) {}
    })();
  </script>
</body>
</html>
