<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Custom Widget 1</title>
  <style>
    /*
     * ═══════════════════════════════════════════════════════════════════════════
     * CUSTOM WIDGET 1 - BEARBEITBARE VORLAGE
     * ═══════════════════════════════════════════════════════════════════════════
     * 
     * Diese Datei kannst du frei bearbeiten um dein eigenes Design zu erstellen!
     * 
     * VERFÜGBARE CSS-VARIABLEN (werden automatisch vom Album-Cover gesetzt):
     *   --r, --g, --b  = RGB-Werte der dominanten Farbe vom Album-Cover
     * 
     * BEISPIEL-VERWENDUNG:
     *   background: rgb(var(--r), var(--g), var(--b));
     *   background: rgba(var(--r), var(--g), var(--b), 0.5);  // mit Transparenz
     *   box-shadow: 0 0 20px rgba(var(--r), var(--g), var(--b), 0.3);
     * 
     * WICHTIGE KLASSEN:
     *   .widget        = Hauptcontainer wenn Song läuft
     *   .widget.paused = Wenn Song pausiert ist
     *   .widget.hidden = Wird ausgeblendet (display: none)
     *   .idle          = Anzeige wenn KEIN Song läuft
     *   .idle.hidden   = Wird ausgeblendet
     * 
     * TIPPS:
     *   - Teste dein Design mit verschiedenen Album-Covern (helle/dunkle Farben)
     *   - Benutze overflow: hidden um Scrollbars zu vermeiden
     *   - Die Fenstergröße kannst du in tauri.conf.json anpassen
     * 
     * ═══════════════════════════════════════════════════════════════════════════
     */

    :root {
      --r: 29;
      --g: 185;
      --b: 84;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 10px;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       IDLE STATE - Wird angezeigt wenn KEIN Song läuft
       Du kannst diesen Bereich komplett anpassen oder entfernen
       ═══════════════════════════════════════════════════════════════════════════ */
    
    .idle {
      width: 220px;
      margin: 0 auto;
      text-align: center;
    }

    .idle.hidden { display: none; }

    .idle-icon {
      width: 160px;
      height: 160px;
      margin: 0 auto 10px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .idle-icon svg {
      width: 60px;
      height: 60px;
      opacity: 0.3;
    }

    .idle-text {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 8px;
    }

    .idle-bar {
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      margin: 0 10px;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       WIDGET - Wird angezeigt wenn ein Song läuft
       Hier kannst du das Hauptdesign anpassen
       ═══════════════════════════════════════════════════════════════════════════ */

    .widget {
      width: 220px;
      margin: 0 auto;
      text-align: center;
    }

    .widget.hidden { display: none; }

    /* Album-Cover */
    .cover {
      width: 160px;
      height: 160px;
      margin: 0 auto 10px;
      border-radius: 10px;
      background: #222;
      background-size: cover;
      background-position: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    /* Cover-Effekt wenn Song spielt (nicht pausiert) */
    .widget:not(.paused) .cover {
      box-shadow: 
        0 10px 30px rgba(0,0,0,0.4),
        0 0 30px rgba(var(--r), var(--g), var(--b), 0.2);
    }

    /* Song-Titel */
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Künstler-Name */
    .artist {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Fortschrittsbalken */
    .progress {
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 10px;
    }

    .progress-fill {
      height: 100%;
      background: rgb(var(--r), var(--g), var(--b));
      width: 0%;
      transition: width 1s linear;
    }

    /* Zeitanzeige */
    .time {
      display: flex;
      justify-content: space-between;
      margin: 4px 10px 0;
      font-size: 9px;
      color: rgba(255,255,255,0.3);
    }

    /* Status-Punkt (zeigt ob Song läuft) */
    .status-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: rgb(var(--r), var(--g), var(--b));
      border-radius: 50%;
      margin-right: 4px;
      animation: blink 1.5s infinite;
    }

    .widget.paused .status-dot {
      background: rgba(255,255,255,0.3);
      animation: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       ENDE DES BEARBEITBAREN CSS-BEREICHS
       ═══════════════════════════════════════════════════════════════════════════ */
  </style>
</head>
<body>
  <!--
    ═══════════════════════════════════════════════════════════════════════════
    HTML STRUKTUR
    
    Du kannst die HTML-Elemente anpassen, aber behalte die IDs bei damit
    das JavaScript die Elemente finden kann!
    
    VERFÜGBARE IDs (werden automatisch vom Script befüllt):
      #idle         - Container für "Kein Song" Anzeige
      #widget       - Hauptcontainer für Song-Anzeige
      #cover        - Album-Cover (als background-image)
      #title        - Song-Titel
      #artist       - Künstler-Name
      #progress     - Fortschrittsbalken (width wird gesetzt)
      #time-current - Aktuelle Spielzeit
      #time-total   - Gesamtlänge des Songs
    
    OPTIONALE IDs (kannst du hinzufügen/entfernen):
      #album        - Album-Name
    ═══════════════════════════════════════════════════════════════════════════
  -->

  <!-- Idle State - Kein Song -->
  <div class="idle" id="idle">
    <div class="idle-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="idle-text">Warte auf Musik...</div>
    <div class="idle-bar"></div>
  </div>

  <!-- Widget - Song läuft -->
  <div class="widget hidden" id="widget">
    <div class="cover" id="cover"></div>
    <div class="title"><span class="status-dot"></span><span id="title">—</span></div>
    <div class="artist" id="artist">—</div>
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="time">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>
  </div>

  <!--
    ═══════════════════════════════════════════════════════════════════════════
    JAVASCRIPT - NICHT BEARBEITEN!
    
    Dieses Script verbindet das Widget mit der App.
    Änderungen hier können das Widget kaputt machen.
    ═══════════════════════════════════════════════════════════════════════════
  -->
  <script type="module">
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.tauri;
    const appWindow = window.__TAURI__.window?.appWindow || window.__TAURI__.window?.getCurrent?.();

    // Fenster verschieben durch Klicken und Ziehen
    if (appWindow) {
      document.addEventListener('mousedown', async (e) => {
        if (e.buttons === 1) {
          try { await appWindow.startDragging(); } catch(e) {}
        }
      });
    }

    const $ = (id) => document.getElementById(id);
    let currentTrack = null;

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
    }

    function update(track) {
      const widget = $('widget');
      const idle = $('idle');
      const cover = $('cover');
      const title = $('title');
      const artist = $('artist');
      const album = $('album');
      const progress = $('progress');
      const timeCurrent = $('time-current');
      const timeTotal = $('time-total');

      // Kein Song? Zeige Idle-State
      if (!track?.track) {
        widget?.classList.add('hidden');
        idle?.classList.remove('hidden');
        return;
      }

      // Song läuft - zeige Widget
      idle?.classList.add('hidden');
      widget?.classList.remove('hidden');
      widget?.classList.toggle('paused', !track.isPlaying);

      // Album-Cover aktualisieren
      if (track.albumCover && track.albumCover !== currentTrack?.albumCover) {
        if (cover) cover.style.backgroundImage = `url('${track.albumCover}')`;
      }

      // Text aktualisieren
      if (title) title.textContent = track.track;
      if (artist) artist.textContent = track.artist;
      if (album) album.textContent = track.album;

      // Farbe vom Album-Cover setzen
      if (track.color) {
        document.documentElement.style.setProperty('--r', track.color.r);
        document.documentElement.style.setProperty('--g', track.color.g);
        document.documentElement.style.setProperty('--b', track.color.b);
      }

      // Fortschritt und Zeit aktualisieren
      if (track.durationMs > 0) {
        if (progress) progress.style.width = `${(track.progressMs / track.durationMs) * 100}%`;
        if (timeCurrent) timeCurrent.textContent = formatTime(track.progressMs);
        if (timeTotal) timeTotal.textContent = formatTime(track.durationMs);
      }

      currentTrack = track;
    }

    // Events von der App empfangen
    listen('track-update', (e) => update(e.payload));
    invoke('get_track').then(update);

    // Fortschritt smooth interpolieren
    setInterval(() => {
      if (currentTrack?.isPlaying && currentTrack.durationMs > 0) {
        currentTrack.progressMs = Math.min(currentTrack.progressMs + 1000, currentTrack.durationMs);
        const progress = $('progress');
        const timeCurrent = $('time-current');
        if (progress) progress.style.width = `${(currentTrack.progressMs / currentTrack.durationMs) * 100}%`;
        if (timeCurrent) timeCurrent.textContent = formatTime(currentTrack.progressMs);
      }
    }, 1000);
  </script>
</body>
</html>
