<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Custom Widget 1</title>
  <style>
    /*
     * ═══════════════════════════════════════════════════════════════════════════
     * CUSTOM WIDGET 1 - BEARBEITBARE VORLAGE
     * ═══════════════════════════════════════════════════════════════════════════
     * 
     * Diese Datei kannst du frei bearbeiten um dein eigenes Design zu erstellen!
     * 
     * VERFÜGBARE CSS-VARIABLEN (werden automatisch vom Album-Cover gesetzt):
     *   --r, --g, --b  = RGB-Werte der dominanten Farbe vom Album-Cover
     *   --transition-duration = Dauer der Song-Wechsel Animation (Standard: 0.4s)
     * 
     * BEISPIEL-VERWENDUNG:
     *   background: rgb(var(--r), var(--g), var(--b));
     *   background: rgba(var(--r), var(--g), var(--b), 0.5);  // mit Transparenz
     *   box-shadow: 0 0 20px rgba(var(--r), var(--g), var(--b), 0.3);
     * 
     * ANIMATIONEN:
     *   - Cover: Crossfade zwischen altem und neuem Bild
     *   - Text: Slide-up Animation
     *   - Farben: Smooth Transition
     * 
     * ═══════════════════════════════════════════════════════════════════════════
     */

    :root {
      --r: 29;
      --g: 185;
      --b: 84;
      --transition-duration: 0.4s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 10px;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       IDLE STATE - Wird angezeigt wenn KEIN Song läuft
       ═══════════════════════════════════════════════════════════════════════════ */
    
    .idle {
      width: 220px;
      margin: 0 auto;
      text-align: center;
    }

    .idle.hidden { display: none; }

    .idle-icon {
      width: 160px;
      height: 160px;
      margin: 0 auto 10px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .idle-icon svg {
      width: 60px;
      height: 60px;
      opacity: 0.15;
    }

    .idle-text {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      margin-bottom: 8px;
    }

    .idle-bar {
      width: 80%;
      height: 3px;
      margin: 0 auto;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       WIDGET CONTAINER
       ═══════════════════════════════════════════════════════════════════════════ */

    .widget {
      width: 220px;
      margin: 0 auto;
      text-align: center;
    }

    .widget.hidden { display: none; }

    /* ═══════════════════════════════════════════════════════════════════════════
       COVER MIT CROSSFADE ANIMATION
       ═══════════════════════════════════════════════════════════════════════════ */

    .cover-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 12px;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 
        0 8px 25px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.05),
        0 0 40px rgba(var(--r), var(--g), var(--b), 0.2);
      transition: box-shadow var(--transition-duration) ease;
    }

    .cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-color: rgba(255,255,255,0.03);
      transition: opacity var(--transition-duration) ease,
                  transform var(--transition-duration) ease;
    }

    .cover.new {
      opacity: 1;
      transform: scale(1);
    }

    .cover.old {
      opacity: 0;
      transform: scale(0.95);
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       TEXT MIT SLIDE ANIMATION
       ═══════════════════════════════════════════════════════════════════════════ */

    .text-container {
      position: relative;
      overflow: hidden;
    }

    .title-container { height: 22px; margin-bottom: 4px; }
    .artist-container { height: 16px; }

    .title, .artist {
      position: absolute;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform var(--transition-duration) ease,
                  opacity var(--transition-duration) ease;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .artist {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
    }

    .title.new, .artist.new {
      transform: translateY(0);
      opacity: 1;
    }

    .title.old, .artist.old {
      transform: translateY(-100%);
      opacity: 0;
    }

    .title.entering, .artist.entering {
      transform: translateY(100%);
      opacity: 0;
    }

    /* Status Dot (im Title) */
    .status-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: rgb(var(--r), var(--g), var(--b));
      border-radius: 50%;
      margin-right: 4px;
      animation: blink 1.5s infinite;
      transition: background var(--transition-duration) ease;
    }

    .widget.paused .status-dot {
      background: rgba(255,255,255,0.3);
      animation: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       PROGRESS BAR
       ═══════════════════════════════════════════════════════════════════════════ */

    .progress {
      width: 90%;
      height: 3px;
      margin: 12px auto 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,
        rgb(var(--r), var(--g), var(--b)),
        rgba(var(--r), var(--g), var(--b), 0.5)
      );
      border-radius: 2px;
      transition: width 1s linear, background var(--transition-duration) ease;
    }

    .time {
      display: flex;
      justify-content: space-between;
      width: 90%;
      margin: 0 auto;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <!-- Idle State - Kein Song -->
  <div class="idle" id="idle">
    <div class="idle-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="idle-text">Warte auf Musik...</div>
    <div class="idle-bar"></div>
  </div>

  <!-- Widget - Song läuft -->
  <div class="widget hidden" id="widget">
    <div class="cover-container">
      <div class="cover new" id="cover"></div>
      <div class="cover old" id="cover-old"></div>
    </div>
    <div class="text-container title-container">
      <div class="title new" id="title"><span class="status-dot"></span>—</div>
      <div class="title old" id="title-old"><span class="status-dot"></span>—</div>
    </div>
    <div class="text-container artist-container">
      <div class="artist new" id="artist">—</div>
      <div class="artist old" id="artist-old">—</div>
    </div>
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="time">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>
  </div>

  <!-- JAVASCRIPT - Verbindet Widget mit der App -->
  <script type="module">
    async function waitForTauri() {
      let attempts = 0;
      while (!window.__TAURI__ && attempts < 100) {
        await new Promise(r => setTimeout(r, 50));
        attempts++;
      }
      return window.__TAURI__;
    }

    (async () => {
      const tauri = await waitForTauri();
      if (!tauri) { console.error('Tauri API nicht verfügbar'); return; }

      const listen = tauri.event?.listen || tauri.listen;
      const invoke = tauri.tauri?.invoke || tauri.invoke;
      const appWindow = tauri.window?.appWindow || tauri.window?.getCurrent?.() || tauri.appWindow;

      if (!listen || !invoke) { console.error('Tauri listen/invoke nicht gefunden'); return; }

      // Fenster ziehen
      if (appWindow) {
        document.addEventListener('mousedown', async (e) => {
          if (e.buttons === 1) {
            try { await appWindow.startDragging(); } catch(e) {}
          }
        });
      }

      const $ = (id) => document.getElementById(id);
      let currentTrack = null;
      let isTransitioning = false;

      // Akzentfarbe vom Main Window
      window.addEventListener('accent-color-change', (e) => {
        setColor(e.detail.r, e.detail.g, e.detail.b);
      });

      function setColor(r, g, b) {
        document.documentElement.style.setProperty('--r', r);
        document.documentElement.style.setProperty('--g', g);
        document.documentElement.style.setProperty('--b', b);
      }

      function formatTime(ms) {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
      }

      async function transitionToNewTrack(track) {
        if (isTransitioning) return;
        isTransitioning = true;

        const cover = $('cover');
        const coverOld = $('cover-old');
        const title = $('title');
        const titleOld = $('title-old');
        const artist = $('artist');
        const artistOld = $('artist-old');

        // Alten Inhalt kopieren
        if (currentTrack) {
          coverOld.style.backgroundImage = cover.style.backgroundImage;
          titleOld.innerHTML = title.innerHTML;
          artistOld.textContent = artist.textContent;

          coverOld.classList.remove('old');
          coverOld.classList.add('new');
          cover.classList.remove('new');
          cover.classList.add('old');

          titleOld.classList.remove('old');
          titleOld.classList.add('new');
          title.classList.add('entering');
          title.classList.remove('new');

          artistOld.classList.remove('old');
          artistOld.classList.add('new');
          artist.classList.add('entering');
          artist.classList.remove('new');
        }

        // Neuen Inhalt setzen
        cover.style.backgroundImage = `url('${track.albumCover}')`;
        title.innerHTML = `<span class="status-dot"></span>${track.track}`;
        artist.textContent = track.artist;

        if (track.color) {
          setColor(track.color.r, track.color.g, track.color.b);
        }

        await new Promise(r => setTimeout(r, 50));

        // Transition starten
        cover.classList.remove('old');
        cover.classList.add('new');
        coverOld.classList.remove('new');
        coverOld.classList.add('old');

        title.classList.remove('entering');
        title.classList.add('new');
        titleOld.classList.remove('new');
        titleOld.classList.add('old');

        artist.classList.remove('entering');
        artist.classList.add('new');
        artistOld.classList.remove('new');
        artistOld.classList.add('old');

        await new Promise(r => setTimeout(r, 400));
        isTransitioning = false;
      }

      function update(track) {
        const widget = $('widget');
        const idle = $('idle');
        const progress = $('progress');
        const timeCurrent = $('time-current');
        const timeTotal = $('time-total');

        if (!track?.track) {
          widget?.classList.add('hidden');
          idle?.classList.remove('hidden');
          currentTrack = null;
          return;
        }

        idle?.classList.add('hidden');
        widget?.classList.remove('hidden');

        const isNewTrack = !currentTrack || 
          currentTrack.track !== track.track || 
          currentTrack.artist !== track.artist;

        if (isNewTrack) {
          transitionToNewTrack(track);
        }

        widget?.classList.toggle('paused', !track.isPlaying);

        if (track.durationMs > 0) {
          if (progress) progress.style.width = `${(track.progressMs / track.durationMs) * 100}%`;
          if (timeCurrent) timeCurrent.textContent = formatTime(track.progressMs);
          if (timeTotal) timeTotal.textContent = formatTime(track.durationMs);
        }

        currentTrack = { ...track };
      }

      await listen('track-update', (e) => update(e.payload));
      try { const track = await invoke('get_track'); update(track); } catch (e) {}

      setInterval(() => {
        if (currentTrack?.isPlaying && currentTrack.durationMs > 0) {
          currentTrack.progressMs = Math.min(currentTrack.progressMs + 1000, currentTrack.durationMs);
          const progress = $('progress');
          const timeCurrent = $('time-current');
          if (progress) progress.style.width = `${(currentTrack.progressMs / currentTrack.durationMs) * 100}%`;
          if (timeCurrent) timeCurrent.textContent = formatTime(currentTrack.progressMs);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
