<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Custom Widget 2</title>
  <style>
    /*
     * ═══════════════════════════════════════════════════════════════════════════
     * CUSTOM WIDGET 2 - BEARBEITBARE VORLAGE (NEON STYLE)
     * ═══════════════════════════════════════════════════════════════════════════
     * 
     * Dieses Widget hat einen modernen Neon/Glow-Stil.
     * Du kannst es frei anpassen!
     * 
     * ANIMATIONEN:
     *   - Cover: Crossfade mit leichtem Zoom
     *   - Text: Slide-up Animation  
     *   - Farben: Smooth Transition für Glow-Effekte
     * 
     * ═══════════════════════════════════════════════════════════════════════════
     */

    :root {
      --r: 29;
      --g: 185;
      --b: 84;
      --transition-duration: 0.5s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       IDLE STATE
       ═══════════════════════════════════════════════════════════════════════════ */

    .idle {
      width: 340px;
      background: linear-gradient(160deg, rgba(20,20,25,0.95), rgba(5,5,10,0.98));
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .idle.hidden { display: none; }

    .idle-cover {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .idle-cover svg {
      width: 50px;
      height: 50px;
      opacity: 0.15;
    }

    .idle-text {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.2);
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       WIDGET - NEON STYLE
       ═══════════════════════════════════════════════════════════════════════════ */

    .widget {
      width: 340px;
      background: linear-gradient(160deg, 
        rgba(20,20,25,0.95), 
        rgba(var(--r), var(--g), var(--b), 0.05),
        rgba(5,5,10,0.98)
      );
      border-radius: 20px;
      padding: 24px;
      border: 1px solid rgba(var(--r), var(--g), var(--b), 0.15);
      box-shadow: 
        0 20px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(var(--r), var(--g), var(--b), 0.1),
        inset 0 1px 0 rgba(255,255,255,0.05);
      transition: background var(--transition-duration) ease,
                  border-color var(--transition-duration) ease,
                  box-shadow var(--transition-duration) ease;
    }

    .widget.hidden { display: none; }

    /* ═══════════════════════════════════════════════════════════════════════════
       HEADER MIT STATUS
       ═══════════════════════════════════════════════════════════════════════════ */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .bar {
      width: 3px;
      background: rgb(var(--r), var(--g), var(--b));
      border-radius: 1px;
      transition: background var(--transition-duration) ease;
    }

    .bar:nth-child(1) { height: 40%; animation: bar1 0.8s infinite; }
    .bar:nth-child(2) { height: 70%; animation: bar2 0.8s infinite 0.2s; }
    .bar:nth-child(3) { height: 50%; animation: bar3 0.8s infinite 0.4s; }
    .bar:nth-child(4) { height: 80%; animation: bar4 0.8s infinite 0.1s; }

    .widget.paused .bar { animation: none; opacity: 0.3; }

    @keyframes bar1 { 0%,100% { height: 40%; } 50% { height: 80%; } }
    @keyframes bar2 { 0%,100% { height: 70%; } 50% { height: 30%; } }
    @keyframes bar3 { 0%,100% { height: 50%; } 50% { height: 90%; } }
    @keyframes bar4 { 0%,100% { height: 80%; } 50% { height: 40%; } }

    .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgb(var(--r), var(--g), var(--b));
      transition: color var(--transition-duration) ease;
    }

    .widget.paused .label { color: rgba(255,255,255,0.3); }

    /* ═══════════════════════════════════════════════════════════════════════════
       MAIN CONTENT MIT COVER
       ═══════════════════════════════════════════════════════════════════════════ */

    .main {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .cover-container {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 
        0 8px 30px rgba(0,0,0,0.4),
        0 0 30px rgba(var(--r), var(--g), var(--b), 0.2);
      transition: box-shadow var(--transition-duration) ease;
    }

    .cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-color: rgba(255,255,255,0.03);
      transition: opacity var(--transition-duration) ease,
                  transform var(--transition-duration) ease;
    }

    .cover.new {
      opacity: 1;
      transform: scale(1);
    }

    .cover.old {
      opacity: 0;
      transform: scale(1.05);
    }

    .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       TEXT MIT SLIDE ANIMATION
       ═══════════════════════════════════════════════════════════════════════════ */

    .text-container {
      position: relative;
      overflow: hidden;
    }

    .title-container { height: 26px; margin-bottom: 6px; }
    .artist-container { height: 20px; }

    .title, .artist {
      position: absolute;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform var(--transition-duration) ease,
                  opacity var(--transition-duration) ease;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(var(--r), var(--g), var(--b), 0.3);
      transition: text-shadow var(--transition-duration) ease,
                  transform var(--transition-duration) ease,
                  opacity var(--transition-duration) ease;
    }

    .artist {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }

    .title.new, .artist.new {
      transform: translateY(0);
      opacity: 1;
    }

    .title.old, .artist.old {
      transform: translateY(-100%);
      opacity: 0;
    }

    .title.entering, .artist.entering {
      transform: translateY(100%);
      opacity: 0;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       PROGRESS BAR MIT GLOW
       ═══════════════════════════════════════════════════════════════════════════ */

    .progress-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-variant-numeric: tabular-nums;
      min-width: 35px;
    }

    .time:last-child { text-align: right; }

    .progress {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,
        rgb(var(--r), var(--g), var(--b)),
        rgba(var(--r), var(--g), var(--b), 0.6)
      );
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(var(--r), var(--g), var(--b), 0.5);
      transition: width 1s linear, 
                  background var(--transition-duration) ease,
                  box-shadow var(--transition-duration) ease;
    }
  </style>
</head>
<body>
  <!-- Idle State -->
  <div class="idle" id="idle">
    <div class="idle-cover">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="idle-text">Warte auf Musik...</div>
  </div>

  <!-- Widget -->
  <div class="widget hidden" id="widget">
    <div class="header">
      <div class="now-playing">
        <div class="bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <span class="label">Now Playing</span>
      </div>
    </div>

    <div class="main">
      <div class="cover-container">
        <div class="cover new" id="cover"></div>
        <div class="cover old" id="cover-old"></div>
      </div>
      <div class="info">
        <div class="text-container title-container">
          <div class="title new" id="title">—</div>
          <div class="title old" id="title-old">—</div>
        </div>
        <div class="text-container artist-container">
          <div class="artist new" id="artist">—</div>
          <div class="artist old" id="artist-old">—</div>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <span class="time" id="time-current">0:00</span>
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
      <span class="time" id="time-total">0:00</span>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script type="module">
    async function waitForTauri() {
      let attempts = 0;
      while (!window.__TAURI__ && attempts < 100) {
        await new Promise(r => setTimeout(r, 50));
        attempts++;
      }
      return window.__TAURI__;
    }

    (async () => {
      const tauri = await waitForTauri();
      if (!tauri) { console.error('Tauri API nicht verfügbar'); return; }

      const listen = tauri.event?.listen || tauri.listen;
      const invoke = tauri.tauri?.invoke || tauri.invoke;
      const appWindow = tauri.window?.appWindow || tauri.window?.getCurrent?.() || tauri.appWindow;

      if (!listen || !invoke) { console.error('Tauri listen/invoke nicht gefunden'); return; }

      if (appWindow) {
        document.addEventListener('mousedown', async (e) => {
          if (e.buttons === 1) {
            try { await appWindow.startDragging(); } catch(e) {}
          }
        });
      }

      const $ = (id) => document.getElementById(id);
      let currentTrack = null;
      let isTransitioning = false;

      window.addEventListener('accent-color-change', (e) => {
        setColor(e.detail.r, e.detail.g, e.detail.b);
      });

      function setColor(r, g, b) {
        document.documentElement.style.setProperty('--r', r);
        document.documentElement.style.setProperty('--g', g);
        document.documentElement.style.setProperty('--b', b);
      }

      function formatTime(ms) {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
      }

      async function transitionToNewTrack(track) {
        if (isTransitioning) return;
        isTransitioning = true;

        const cover = $('cover');
        const coverOld = $('cover-old');
        const title = $('title');
        const titleOld = $('title-old');
        const artist = $('artist');
        const artistOld = $('artist-old');

        if (currentTrack) {
          coverOld.style.backgroundImage = cover.style.backgroundImage;
          titleOld.textContent = title.textContent;
          artistOld.textContent = artist.textContent;

          coverOld.classList.remove('old');
          coverOld.classList.add('new');
          cover.classList.remove('new');
          cover.classList.add('old');

          titleOld.classList.remove('old');
          titleOld.classList.add('new');
          title.classList.add('entering');
          title.classList.remove('new');

          artistOld.classList.remove('old');
          artistOld.classList.add('new');
          artist.classList.add('entering');
          artist.classList.remove('new');
        }

        cover.style.backgroundImage = `url('${track.albumCover}')`;
        title.textContent = track.track;
        artist.textContent = track.artist;

        if (track.color) {
          setColor(track.color.r, track.color.g, track.color.b);
        }

        await new Promise(r => setTimeout(r, 50));

        cover.classList.remove('old');
        cover.classList.add('new');
        coverOld.classList.remove('new');
        coverOld.classList.add('old');

        title.classList.remove('entering');
        title.classList.add('new');
        titleOld.classList.remove('new');
        titleOld.classList.add('old');

        artist.classList.remove('entering');
        artist.classList.add('new');
        artistOld.classList.remove('new');
        artistOld.classList.add('old');

        await new Promise(r => setTimeout(r, 500));
        isTransitioning = false;
      }

      function update(track) {
        const widget = $('widget');
        const idle = $('idle');
        const progress = $('progress');
        const timeCurrent = $('time-current');
        const timeTotal = $('time-total');

        if (!track?.track) {
          widget?.classList.add('hidden');
          idle?.classList.remove('hidden');
          currentTrack = null;
          return;
        }

        idle?.classList.add('hidden');
        widget?.classList.remove('hidden');

        const isNewTrack = !currentTrack || 
          currentTrack.track !== track.track || 
          currentTrack.artist !== track.artist;

        if (isNewTrack) {
          transitionToNewTrack(track);
        }

        widget?.classList.toggle('paused', !track.isPlaying);

        if (track.durationMs > 0) {
          if (progress) progress.style.width = `${(track.progressMs / track.durationMs) * 100}%`;
          if (timeCurrent) timeCurrent.textContent = formatTime(track.progressMs);
          if (timeTotal) timeTotal.textContent = formatTime(track.durationMs);
        }

        currentTrack = { ...track };
      }

      await listen('track-update', (e) => update(e.payload));
      try { const track = await invoke('get_track'); update(track); } catch (e) {}

      setInterval(() => {
        if (currentTrack?.isPlaying && currentTrack.durationMs > 0) {
          currentTrack.progressMs = Math.min(currentTrack.progressMs + 1000, currentTrack.durationMs);
          const progress = $('progress');
          const timeCurrent = $('time-current');
          if (progress) progress.style.width = `${(currentTrack.progressMs / currentTrack.durationMs) * 100}%`;
          if (timeCurrent) timeCurrent.textContent = formatTime(currentTrack.progressMs);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
