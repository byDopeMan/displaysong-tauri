<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Custom Widget 2</title>
  <style>
    /*
     * ═══════════════════════════════════════════════════════════════════════════
     * CUSTOM WIDGET 2 - NEON BAR DESIGN
     * ═══════════════════════════════════════════════════════════════════════════
     * 
     * Horizontales Design mit Neon-Akzenten und schwebender Progress-Bar
     * 
     * VERFÜGBARE CSS-VARIABLEN:
     *   --r, --g, --b  = RGB-Werte der dominanten Farbe vom Album-Cover
     * 
     * ═══════════════════════════════════════════════════════════════════════════
     */

    :root {
      --r: 29;
      --g: 185;
      --b: 84;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 8px;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       IDLE STATE
       ═══════════════════════════════════════════════════════════════════════════ */
    
    .idle {
      background: linear-gradient(90deg, rgba(20,20,20,0.95), rgba(30,30,30,0.9));
      border-radius: 50px;
      padding: 10px 20px 10px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .idle.hidden { display: none; }

    .idle-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .idle-icon svg {
      width: 20px;
      height: 20px;
      opacity: 0.25;
    }

    .idle-text {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      flex: 1;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       WIDGET - NEON BAR
       ═══════════════════════════════════════════════════════════════════════════ */

    .widget {
      position: relative;
      background: linear-gradient(
        90deg, 
        rgba(var(--r), var(--g), var(--b), 0.08),
        rgba(20,20,20,0.95)
      );
      border-radius: 50px;
      padding: 10px 20px 10px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(var(--r), var(--g), var(--b), 0.15);
      box-shadow: 
        0 4px 20px rgba(0,0,0,0.4),
        inset 0 0 30px rgba(var(--r), var(--g), var(--b), 0.03);
    }

    .widget.hidden { display: none; }

    /* Neon Glow Line am unteren Rand */
    .widget::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20px;
      right: 20px;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        rgb(var(--r), var(--g), var(--b)),
        transparent
      );
      opacity: 0.6;
      filter: blur(1px);
    }

    .widget.paused::after {
      opacity: 0.2;
    }

    /* Rundes Cover */
    .cover {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #222;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      box-shadow: 
        0 0 0 2px rgba(var(--r), var(--g), var(--b), 0.3),
        0 2px 10px rgba(0,0,0,0.3);
      transition: box-shadow 0.3s, transform 0.3s;
    }

    .widget:not(.paused) .cover {
      box-shadow: 
        0 0 0 2px rgba(var(--r), var(--g), var(--b), 0.5),
        0 0 15px rgba(var(--r), var(--g), var(--b), 0.3),
        0 2px 10px rgba(0,0,0,0.3);
      animation: pulse-cover 2s ease-in-out infinite;
    }

    @keyframes pulse-cover {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* Info */
    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }

    .artist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      color: rgb(var(--r), var(--g), var(--b));
      font-weight: 500;
      flex-shrink: 0;
    }

    /* Status Indicator */
    .status {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(var(--r), var(--g), var(--b), 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-bars {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 14px;
    }

    .status-bars span {
      width: 3px;
      background: rgb(var(--r), var(--g), var(--b));
      border-radius: 1px;
      animation: bar 0.8s ease-in-out infinite;
    }

    .status-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .status-bars span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .status-bars span:nth-child(3) { height: 4px; animation-delay: 0.3s; }

    @keyframes bar {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.5); }
    }

    .widget.paused .status-bars span {
      animation: none;
      opacity: 0.3;
    }

    /* Progress im unteren Bereich */
    .progress-wrap {
      position: absolute;
      bottom: 6px;
      left: 60px;
      right: 60px;
      height: 2px;
    }

    .progress {
      height: 100%;
      background: rgba(255,255,255,0.1);
      border-radius: 1px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: rgb(var(--r), var(--g), var(--b));
      width: 0%;
      transition: width 1s linear;
      box-shadow: 0 0 6px rgba(var(--r), var(--g), var(--b), 0.5);
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       ENDE CSS
       ═══════════════════════════════════════════════════════════════════════════ */
  </style>
</head>
<body>
  <!--
    ═══════════════════════════════════════════════════════════════════════════
    HTML STRUKTUR - IDs nicht ändern!
    ═══════════════════════════════════════════════════════════════════════════
  -->

  <!-- Idle State -->
  <div class="idle" id="idle">
    <div class="idle-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="idle-text">Warte auf Musik...</div>
  </div>

  <!-- Widget -->
  <div class="widget hidden" id="widget">
    <div class="cover" id="cover"></div>
    <div class="info">
      <div class="title" id="title">—</div>
      <div class="meta">
        <span class="artist" id="artist">—</span>
        <span class="time"><span id="time-current">0:00</span> / <span id="time-total">0:00</span></span>
      </div>
    </div>
    <div class="status">
      <div class="status-bars">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
    </div>
  </div>

  <!--
    ═══════════════════════════════════════════════════════════════════════════
    JAVASCRIPT - NICHT BEARBEITEN!
    ═══════════════════════════════════════════════════════════════════════════
  -->
  <script type="module" src="/templates/custom2.ts"></script>
</body>
</html>
