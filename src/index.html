<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Prevent the WebView from serving a stale cached UI after updates -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DisplaySong</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/forms.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/views.css">
  <link rel="stylesheet" href="styles/plugins.css">
  <link rel="stylesheet" href="features/queue/queue.css">
</head>
<body>
  <div class="app">
    <!-- Titlebar is mounted here by the Svelte <Titlebar> component (app.js) -->

    <!-- Navigation Tabs -->
    <nav class="tabs hidden" id="nav-tabs">
      <button class="tab active" data-tab="player" data-i18n="nav.player">Player</button>
      <button class="tab" data-tab="queue" data-i18n="nav.queue" id="queue-tab" style="display: none;">Queue</button>
      <button class="tab" data-tab="history" data-i18n="nav.history">Verlauf</button>
      <button class="tab" data-tab="designs" data-i18n="nav.designs">Designs</button>
      <button class="tab" data-tab="plugins" id="plugins-tab" style="display: none;" data-i18n="nav.plugins">Plugins</button>
      <button class="tab" data-tab="settings" data-i18n="nav.settings">Einstellungen</button>
    </nav>

    <div class="content">
      <!-- Global Cover Background (wenn Player Tab deaktiviert) -->
      <div class="global-cover-bg" id="global-cover-bg"></div>
      <!-- Loading View (beim Start) -->
      <div id="loading-view" class="view">
        <div class="loading-container">
          <div class="logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
          <h1>DisplaySong</h1>
          <div class="spinner"></div>
          <p id="loading-status">Starte...</p>
        </div>
      </div>

      <!-- Setup view (features/provider/Setup.svelte) -->
      <div id="setup-view" class="view hidden">
        <div id="setup-mount"></div>
      </div>
      
      <!-- Spotify setup view (features/provider/SpotifySetup.svelte) -->
      <div id="spotify-setup-view" class="view hidden">
        <div id="spotify-setup-mount"></div>
      </div>
      
      <!-- Access Request Modal (geheim - 420) → features/access/AccessRequestModal.svelte -->
      <div id="access-request-mount"></div>

      <!-- Auth View (features/provider/AuthView.svelte) -->
      <div id="auth-view" class="view hidden">
        <div id="auth-mount"></div>
      </div>

      <!-- Player View -->
      <div id="player-view" class="view hidden">
        <div class="player-container">
          <!-- Now-playing player rendered by features/player/Player.svelte.
               display:contents so its children lay out as if direct children of
               .player-container (the covers are absolutely positioned to it). -->
          <div id="player-mount" style="display: contents;"></div>

          <!-- Queue under the player (features/queue/PlayerQueue.svelte) -->
          <div id="player-queue-mount"></div>
        </div>
      </div>

      <!-- Queue View (features/queue/QueueView.svelte; shown when Player tab is off) -->
      <div id="queue-view" class="view hidden">
        <div id="queue-view-mount"></div>
      </div>

      <!-- History View (features/history/HistoryView.svelte) -->
      <div id="history-view" class="view hidden">
        <div id="history-mount"></div>
      </div>

      <!-- Designs View -->
      <div id="designs-view" class="view hidden">
        <!-- Designs view (features/designs/Designs.svelte) -->
        <div id="designs-mount"></div>
      </div>

      <!-- Plugins View -->
      <div id="plugins-view" class="view hidden">
        <div id="plugins-mount"></div>
      </div>

      <!-- Settings View -->
      <div id="settings-view" class="view hidden">
        <h2 data-i18n="settings.title">Einstellungen</h2>
        
        <!-- Settings sections (features/settings/Settings.svelte) -->
        <div id="settings-mount"></div>
      </div>
      
      <!-- Blocklist Modal (features/history/BlocklistModal.svelte) -->
      <div id="blocklist-mount"></div>

      <!-- App-info modals (features/settings/InfoModals.svelte) -->
      <div id="info-modals-mount"></div>

      
      <!-- Modal shells (features → ui/Modals.svelte) -->
      <div id="modals-mount"></div>
      
      <!-- Source Priority Modal (features/provider/SourcePriorityModal.svelte) -->
      <div id="source-priority-mount"></div>
    </div>
  </div>


  <!-- Floating YouTube-request controls (features/queue/YouTubeControls.svelte).
       Top level so they're reachable regardless of the active tab. -->
  <div id="youtube-controls-mount"></div>

  <script type="module" src="app.ts"></script>
</body>
</html>
